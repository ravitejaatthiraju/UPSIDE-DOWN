<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Flip Runner - Horror Edition</title>
    <style>
        :root {
            --neon-red: #ff0033;
            --neon-blue: #00f2ff;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 0, 0, 0.95);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: var(--font-main);
            color: white;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #game-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            z-index: 10;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: clamp(2.2rem, 12vw, 4.5rem);
            color: var(--neon-red);
            text-transform: uppercase;
            letter-spacing: clamp(4px, 2vw, 8px);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--neon-red), 0 0 40px #000;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.7; }
        }

        .menu-btn {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            padding: clamp(12px, 3vh, 18px) clamp(20px, 5vw, 40px);
            font-size: clamp(1rem, 4vw, 1.2rem);
            cursor: pointer;
            margin: 8px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: clamp(200px, 70vw, 320px);
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .menu-btn:active, .menu-btn:hover {
            background: var(--neon-red);
            color: black;
            box-shadow: 0 0 30px var(--neon-red);
            transform: scale(1.05);
        }

        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: env(safe-area-inset-left, 20px);
            right: env(safe-area-inset-right, 20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1rem, 4vw, 1.8rem);
            text-shadow: 0 0 10px var(--neon-red);
            font-weight: 900;
            transition: opacity 0.5s;
        }

        #hud > div { pointer-events: auto; }

        .power-status {
            position: absolute;
            bottom: clamp(100px, 15vh, 140px);
            left: env(safe-area-inset-left, 20px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .badge {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.9);
            border-left: 5px solid var(--neon-blue);
            font-size: 0.9rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            animation: slideIn 0.3s ease-out;
            font-weight: bold;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .skin-grid {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
            max-height: 40vh;
            overflow-y: auto;
            padding: 10px;
            pointer-events: auto;
        }

        .skin-card {
            border: 2px solid #333;
            padding: 10px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            width: clamp(110px, 35vw, 160px);
            transition: all 0.3s ease;
            position: relative;
            pointer-events: auto;
        }

        .skin-card.active {
            border-color: var(--neon-red);
            background: rgba(255,0,0,0.15);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
        }

        .skin-card img {
            width: 100%;
            height: clamp(80px, 15vh, 120px);
            object-fit: cover;
            margin-bottom: 8px;
            border: 1px solid #444;
            background: #111;
        }

        #mute-toggle, #pause-toggle {
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 10px 15px;
            cursor: pointer;
            z-index: 100;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
            pointer-events: auto;
        }

        #mute-toggle {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 20px);
            right: env(safe-area-inset-right, 20px);
        }

        #pause-toggle {
            margin-left: 10px;
            padding: 10px 14px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #new-best-tag {
            color: #ffd700;
            font-weight: bold;
            display: none;
            margin-top: 10px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.15); } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud" style="opacity: 0;">
            <div id="score-display">Score: 0</div>
            <div style="display: flex; align-items: center;">
                <div id="high-score-display">High: 0</div>
                <button id="pause-toggle">⏸</button>
            </div>
        </div>

        <div class="power-status" id="power-status"></div>

        <div id="start-screen" class="overlay">
            <h1>UpSide Down</h1>
            <p style="color: #aaa; letter-spacing: 1px; font-size: 0.9rem;">SELECT YOUR VESSEL</p>
            <div class="skin-grid" id="skin-selector"></div>
            <button class="menu-btn" id="start-btn">Enter Into upsideDown</button>
            <p style="font-size: 0.8rem; color: #666; margin-top: 15px;">TAP TO FLIP GRAVITY</p>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h1>PAUSED</h1>
            <button class="menu-btn" id="resume-btn">Resume</button>
            <button class="menu-btn" id="quit-btn">Main Menu</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: var(--neon-red); text-shadow: 0 0 30px black;">Consumed</h1>
            <p id="final-score" style="font-size: 1.8rem; margin-bottom: 5px;">Score: 0</p>
            <div id="new-best-tag">NEW BEST!</div>
            <button class="menu-btn" id="restart-btn" style="margin-top: 20px;">Try Again</button>
            <button class="menu-btn" id="main-menu-btn">Main Menu</button>
        </div>

        <button id="mute-toggle">🔊 Sound On</button>
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CONFIG = {
    baseSpeed: 7,
    speedInc: 0.00035,
    groundHeight: 110, // Increased from 70 to minimize the environment gap
    playerBaseWidth: 60, // Reduced from 80
    playerBaseHeight: 75, // Reduced from 100
    particleCount: 40,
    maxParticles: 100
};

// --- IMAGE HANDLING ---
const images = {
    background: new Image(),
    vecna: new Image(),
    demogorgon: new Image()
};

images.background.src = '9213183.jpg';
images.vecna.src = 'Vecna.png';
images.demogorgon.src = 'demogorgon.png';

const SKINS = [
    { id: 'herald', name: 'Vecna', img: images.vecna, color: '#6a0dad', cost: 0, unlocked: true },
    { id: 'beast', name: 'Demogorgon', img: images.demogorgon, color: '#8b0000', cost: 1000, unlocked: false }
];

// --- AUDIO ---
const audio = {
    music: new Audio('Running_Up_That_Hill_-_Stranger_Things.mp3'),
    sfxFlip: new Audio('swing-whoosh-5-198498.mp3'),
    sfxHit: new Audio('Scream.wav'),
    sfxPower: new Audio('I got this.wav'),
    sfxStart: new Audio('whoosh-end-384629.mp3')
};
audio.music.loop = true;
audio.music.volume = 0.45;
audio.sfxFlip.volume = 0.6;
audio.sfxHit.volume = 0.8;
audio.sfxPower.volume = 0.8;
audio.sfxStart.volume = 0.8;

function setMuted(m) {
    isMuted = m;
    for (const k in audio) if (audio[k]) audio[k].muted = m;
    const btn = document.getElementById('mute-toggle');
    if (btn) btn.innerText = m ? '🔇 Sound Off' : '🔊 Sound On';
}

window.addEventListener('load', () => {
    setMuted(false);
    renderSkins();
});

let activeSkin = SKINS[0];
let gameState = 'START';
let score = 0;
let highScore = localStorage.getItem('gravity_flip_highscore') || 0;
let gameSpeed = CONFIG.baseSpeed;
let gravity = 0.85;
let frameCount = 0;
let bgScrollX = 0;
let isMuted = false;
let screenShake = 0;
let level = 1;

// --- ASH & FX PARTICLES ---
class Particle {
    constructor(x, y, color, speedScale = 1) {
        this.reset(x, y, color, speedScale);
    }
    reset(x, y, color, speedScale = 1) {
        this.x = x ?? Math.random() * canvas.width;
        this.y = y ?? Math.random() * canvas.height;
        this.size = 1 + Math.random() * 3;
        this.vx = -(Math.random() * 2 + 0.5) * speedScale;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.opacity = 0.1 + Math.random() * 0.5;
        this.color = color ?? '#888';
        this.isAsh = !x;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.isAsh && this.x < 0) {
            this.x = canvas.width;
            this.y = Math.random() * canvas.height;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// --- PLAYER ---
class Player {
    constructor() {
        const scale = Math.min(1, canvas.height / 800);
        this.w = CONFIG.playerBaseWidth * scale;
        this.h = CONFIG.playerBaseHeight * scale;
        this.x = 100;
        this.y = canvas.height / 2;
        this.vy = 0;
        this.upsideDown = false;
        this.invincible = 0;
        this.trail = [];
    }

    update() {
        const curGrav = this.upsideDown ? -gravity : gravity;
        this.vy += curGrav;
        this.y += this.vy;

        if (this.y > canvas.height - this.h - CONFIG.groundHeight) {
            this.y = canvas.height - this.h - CONFIG.groundHeight;
            this.vy = 0;
        } else if (this.y < CONFIG.groundHeight) {
            this.y = CONFIG.groundHeight;
            this.vy = 0;
        }

        if (this.invincible > 0) this.invincible--;

        // Update trail
        this.trail.push({ x: this.x, y: this.y, upsideDown: this.upsideDown });
        if (this.trail.length > 6) this.trail.shift();
    }

    draw() {
        // Draw Trail
        this.trail.forEach((t, i) => {
            ctx.save();
            ctx.globalAlpha = (i / this.trail.length) * 0.15;
            ctx.translate(t.x + this.w/2, t.y + this.h/2);
            if (t.upsideDown) ctx.scale(1, -1);
            if (activeSkin.img.complete && activeSkin.img.naturalWidth !== 0) {
                ctx.drawImage(activeSkin.img, -this.w/2, -this.h/2, this.w, this.h);
            }
            ctx.restore();
        });

        // Main Player
        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        if (this.upsideDown) ctx.scale(1, -1);
        if (this.invincible > 0 && Math.floor(frameCount/4) % 2 === 0) ctx.globalAlpha = 0.3;
        
        if (activeSkin.img.complete && activeSkin.img.naturalWidth !== 0) {
            ctx.drawImage(activeSkin.img, -this.w/2, -this.h/2, this.w, this.h);
        } else {
            ctx.fillStyle = activeSkin.color;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        }
        
        if (activePowerUps.shield > 0) {
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.strokeRect(-this.w/2 - 3, -this.h/2 - 3, this.w + 6, this.h + 6);
        }
        ctx.restore();
    }
}

// --- OBSTACLES ---
class Obstacle {
    constructor() {
        const scale = Math.min(1, canvas.height / 800);
        this.w = (25 + Math.random() * 20) * scale;
        this.h = (40 + Math.random() * 60) * scale;
        // Start obstacles further back to prevent "sudden" appearance
        this.x = canvas.width + 400; 
        this.isTop = Math.random() > 0.5;
        this.y = this.isTop ? CONFIG.groundHeight : canvas.height - this.h - CONFIG.groundHeight;
    }
    update() { this.x -= (activePowerUps.slowmo > 0 ? gameSpeed * 0.5 : gameSpeed); }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = level >= 3 ? '#ff6600' : '#ff0033';
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        
        ctx.beginPath();
        if (this.isTop) {
            ctx.moveTo(0, 0);
            ctx.lineTo(this.w, 0);
            ctx.lineTo(this.w/2, this.h);
        } else {
            ctx.moveTo(0, this.h);
            ctx.lineTo(this.w, this.h);
            ctx.lineTo(this.w/2, 0);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

class PowerUp {
    constructor() {
        const t = ['slowmo', 'shield', 'double'];
        this.type = t[Math.floor(Math.random() * t.length)];
        this.size = 25;
        this.x = canvas.width + 300;
        this.y = CONFIG.groundHeight + 50 + Math.random() * (canvas.height - CONFIG.groundHeight * 2 - 100);
        this.rot = 0;
    }
    update() { 
        this.x -= gameSpeed * 0.75; 
        this.rot += 0.06;
    }
    draw() {
        const colors = { slowmo: '#00f2ff', shield: '#ffff00', double: '#ff00ff' };
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillStyle = colors[this.type];
        ctx.shadowBlur = 8;
        ctx.shadowColor = colors[this.type];
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.fillStyle = 'black';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.type[0].toUpperCase(), 0, 4);
        ctx.restore();
    }
}

let player;
let obstacles = [];
let powerups = [];
let particles = [];
let activePowerUps = { slowmo: 0, shield: 0, double: 0 };

function init() {
    resize();
    player = new Player();
    obstacles = [];
    powerups = [];
    particles = Array.from({length: CONFIG.particleCount}, () => new Particle());
    score = 0;
    level = 1;
    gameSpeed = CONFIG.baseSpeed;
    frameCount = 0;
    activePowerUps = { slowmo: 0, shield: 0, double: 0 };
    renderSkins();
    document.getElementById('new-best-tag').style.display = 'none';
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function update() {
    if (gameState !== 'PLAYING') return;
    frameCount++;
    gameSpeed += CONFIG.speedInc;
    bgScrollX -= (activePowerUps.slowmo > 0 ? gameSpeed * 0.25 : gameSpeed * 0.45);

    player.update();
    particles.forEach(p => p.update());

    level = Math.floor(score / 200) + 1;

    // Smoother spawning logic
    const spawnFreq = Math.max(40, Math.floor(95 * (7/gameSpeed)));
    if (frameCount % spawnFreq === 0) obstacles.push(new Obstacle());
    if (frameCount % 800 === 0) powerups.push(new PowerUp());

    const paddingX = player.w * 0.25;
    const paddingY = player.h * 0.2;
    const pBox = {
        x: player.x + paddingX,
        y: player.y + paddingY,
        w: player.w - paddingX * 2,
        h: player.h - paddingY * 2
    };

    obstacles.forEach((o, i) => {
        o.update();
        if (player.invincible <= 0 && activePowerUps.shield <= 0 &&
            pBox.x < o.x + o.w && pBox.x + pBox.w > o.x &&
            pBox.y < o.y + o.h && pBox.y + pBox.h > o.y) {
            gameOver();
        }
        if (o.x < -200) obstacles.splice(i, 1);
    });

    powerups.forEach((p, i) => {
        p.update();
        if (player.x < p.x + p.size && player.x + player.w > p.x &&
            player.y < p.y + p.size && player.y + player.h > p.y) {
            activePowerUps[p.type] = 450;
            try { if (!isMuted && audio.sfxPower) { audio.sfxPower.currentTime = 0; audio.sfxPower.play(); } } catch(e) {}
            powerups.splice(i, 1);
        }
    });

    for (let k in activePowerUps) if (activePowerUps[k] > 0) activePowerUps[k]--;
    
    score += (gameSpeed/40) * (activePowerUps.double > 0 ? 2 : 1);
    document.getElementById('score-display').innerText = `Score: ${Math.floor(score)}`;
    if (screenShake > 0) screenShake *= 0.9;
}

function draw() {
    ctx.save();
    if (screenShake > 0.5) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (images.background.complete && images.background.naturalWidth !== 0) {
        const ratio = images.background.width / images.background.height;
        const bgW = canvas.height * ratio;
        const x = bgScrollX % bgW;
        
        ctx.globalAlpha = 0.3 + (level * 0.02);
        ctx.drawImage(images.background, x, 0, bgW, canvas.height);
        ctx.drawImage(images.background, x + bgW, 0, bgW, canvas.height);
        
        ctx.globalAlpha = 1.0;
    }

    particles.forEach(p => p.draw());

    const gColor = level >= 4 ? '#330000' : '#1a0000';
    ctx.fillStyle = gColor;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#440000';
    ctx.fillRect(0, 0, canvas.width, CONFIG.groundHeight);
    ctx.fillRect(0, canvas.height - CONFIG.groundHeight, canvas.width, CONFIG.groundHeight);
    ctx.shadowBlur = 0;

    obstacles.forEach(o => o.draw());
    powerups.forEach(p => p.draw());
    player.draw();

    ctx.restore();
}

function gameOver() {
    gameState = 'GAMEOVER';
    screenShake = 35;
    
    for(let i=0; i<15; i++) {
        const p = new Particle(player.x + player.w/2, player.y + player.h/2, '#ff0000', 2);
        p.vx = (Math.random() - 0.5) * 8;
        p.vy = (Math.random() - 0.5) * 8;
        particles.push(p);
    }

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('gravity_flip_highscore', highScore);
        document.getElementById('new-best-tag').style.display = 'block';
    }
    
    document.getElementById('final-score').innerText = `Score: ${Math.floor(score)}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').style.opacity = '0';
    
    try { if (!isMuted && audio.sfxHit) { audio.sfxHit.currentTime = 0; audio.sfxHit.play(); } } catch(e) {}
    try { if (audio.music) { audio.music.pause(); audio.music.currentTime = 0; } } catch(e) {}
}

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        document.getElementById('pause-screen').classList.remove('hidden');
        try { audio.music.pause(); } catch(e) {}
    } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        document.getElementById('pause-screen').classList.add('hidden');
        try { if (!isMuted) audio.music.play(); } catch(e) {}
    }
}

function renderSkins() {
    const s = document.getElementById('skin-selector');
    s.innerHTML = '';
    SKINS.forEach(skin => {
        const card = document.createElement('div');
        card.className = `skin-card ${skin === activeSkin ? 'active' : ''}`;
        card.innerHTML = `<img src="${skin.img.src}" onerror="this.style.background='${skin.color}'"><div>${skin.name}</div>`;
        card.onclick = (e) => { 
            e.stopPropagation();
            activeSkin = skin; 
            renderSkins(); 
        };
        s.appendChild(card);
    });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function act(e) {
    const isButton = e && e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'));
    const isSkinCard = e && e.target && e.target.closest('.skin-card');

    if (gameState === 'PLAYING' && isButton) return;

    if (gameState === 'START') {
        if (!isSkinCard) {
            gameState = 'PLAYING';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').style.opacity = '1';
            init();
            try { if (!isMuted && audio.sfxStart) { audio.sfxStart.currentTime = 0; audio.sfxStart.play(); } } catch(e) {}
            try { if (!isMuted && audio.music) audio.music.play(); } catch(e) {}
        }
    }
    else if (gameState === 'PLAYING') {
        player.upsideDown = !player.upsideDown;
        screenShake = 6;
        try { if (!isMuted && audio.sfxFlip) { audio.sfxFlip.currentTime = 0; audio.sfxFlip.play(); } } catch(e) {}
    }
    else if (gameState === 'GAMEOVER') {
        if (!e || e.target === canvas || isButton) {
            gameState = 'PLAYING';
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').style.opacity = '1';
            init();
            try { if (!isMuted && audio.music) audio.music.play(); } catch(e) {}
        }
    }
}

window.addEventListener('keydown', e => { 
    if(e.code === 'Space') { e.preventDefault(); act(); }
    if(e.code === 'Escape') togglePause();
});

canvas.addEventListener('mousedown', (e) => act(e));
canvas.addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    act(e); 
}, {passive: false});

document.getElementById('start-btn').onclick = (e) => { e.stopPropagation(); act(e); };
document.getElementById('restart-btn').onclick = (e) => { e.stopPropagation(); act(e); };
document.getElementById('resume-btn').onclick = togglePause;
document.getElementById('pause-toggle').onclick = (e) => {
    e.stopPropagation();
    togglePause();
};
document.getElementById('main-menu-btn').onclick = () => location.reload();
document.getElementById('quit-btn').onclick = () => location.reload();
document.getElementById('mute-toggle').onclick = () => setMuted(!isMuted);

init();
loop();
</script>
</body>
</html>
